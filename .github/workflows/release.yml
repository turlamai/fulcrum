name: Release

# Stable tags require successful CI and Product Acceptance on the tagged
# commit and explicit stable-promotion approval. macOS production signing is
# credential-driven (family contract, turlamai/taskly#122 template): with the
# five account-level secrets present (DEVELOPER_ID_P12_B64,
# DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) every
# macOS run Developer ID-signs, notarizes and staples; without them manual
# dispatch builds stay ad-hoc and tag pushes fail closed instead of shipping
# ad-hoc. Windows signing stays an independent opt-in variable
# (FULCRUM_WINDOWS_SIGNING_MODE, docs/release-signing-policy.md). Linux
# artifact signing and the independent Ed25519 update feed remain mandatory.

on:
  push:
    tags: ["v*"]
  # A VERSION-bump gate may create its tag with GITHUB_TOKEN. Those push
  # events do not start other workflows; explicitly dispatch the same
  # tag-driven pipeline instead.
  workflow_dispatch:

env:
  # Immutable Rivet merge commit includes the crash-safe AppImageHandoff
  # accepted as upstream #291; v0.12.0 does not contain that API.
  # Single pin source, same value as ci.yml (workflow-level env does not
  # cross files, so this is defined here too). Contexts aren't allowed in
  # `uses:`, so the setup-embed-racket action ref must be bumped in
  # lockstep by hand.
  # Immutable upstream revision containing the macOS hardened-runtime
  # verification fix (rivet#468: `codesign -d` cannot see `(runtime)`; the
  # flag is only in `-dv`), on top of the earlier AppImage handoff,
  # branded-DMG signature preservation, macOS update rollback safety and
  # the unprivileged RPM packaging fixes (#431/#433) that the previous pin
  # 7f34eee8 carried.
  RIVET_PIN: 33de65ccb5d72f9ac38ff982aa4495467f89f213
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION, rivet.rktd and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          PACKAGE_VERSION="$(tr -d '\r\n' < VERSION)"
          grep -q "^## \[${PACKAGE_VERSION}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${PACKAGE_VERSION}]' section"; exit 1; }


      - name: Validate independent platform signing modes
        shell: bash
        env:
          WINDOWS_SIGNING_MODE: ${{ vars.FULCRUM_WINDOWS_SIGNING_MODE }}
        run: bash scripts/check-release-signing-modes.sh "$WINDOWS_SIGNING_MODE"

      # Manual tag pushes and workflow_dispatch must not bypass the same
      # exact-commit CI + packaged Product Acceptance gate as VERSION bumps.
      # Stable tags require a main push; prerelease tags may use verified PR
      # runs for a release-candidate branch.
      - name: Require green CI and Product Acceptance for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            allowed_event='(.event == "push" or .event == "pull_request")'
          else
            allowed_event='(.event == "push" and .head_branch == "main")'
          fi
          for workflow in ci.yml acceptance.yml; do
            count="$(gh api "repos/$GH_REPO/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_sha == \"$GITHUB_SHA\" and .conclusion == \"success\" and .status == \"completed\" and $allowed_event)] | length")"
            if [[ "$count" -lt 1 ]]; then
              echo "::error::$workflow has no successful trusted run for tagged commit $GITHUB_SHA"
              exit 1
            fi
            echo "$workflow: trusted green run found for $GITHUB_SHA"
          done

  package:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
            racket-arch: arm64
          # Intel macs stay on the family matrix (taskly ships the same pair);
          # macos-15-intel is the last Intel runner generation.
          - os: macos-15-intel
            platform: macos
            arch: x64
            racket-arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
            racket-arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            racket-arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            racket-arch: arm64
    env:
      # Family credential contract (turlamai/taskly#122 template): production
      # signing lights up as soon as the account-level secrets exist
      # (Developer ID p12 + App Store Connect API key) and applies to every
      # workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS 9.3
        if: matrix.platform == 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Racket
        if: matrix.platform != 'linux'
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          # macOS packaging must be arch-native: without this the runner
          # builds under Rosetta and ships an x86_64 app (the PodLens
          # release shipped exactly that bug).
          architecture: ${{ matrix.racket-arch }}
      - name: Install Linux toolchain
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgtk-4-dev libglib2.0-dev zlib1g-dev liblz4-dev libncurses-dev \
            libxtst-dev \
            rpm desktop-file-utils
      - name: Set up embeddable Racket CS (Linux)
        if: matrix.platform == 'linux'
        uses: turlamai/rivet/.github/actions/setup-embed-racket@33de65ccb5d72f9ac38ff982aa4495467f89f213
      # Installed after the embeddable runtime so Rivet's catalog closure and
      # Fulcrum's SQLite dependency (db-lib) resolve against the minimal build.
      - name: Install Rivet (catalog)
        run: |
          racket -e '(dynamic-require (quote db) #f)' || raco pkg install --auto --no-docs db-lib
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        if: matrix.platform == 'windows'
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
        shell: bash
      # Like Taskly, generate a 2x Finder DMG background before packaging.
      # Rivet v0.12.0 uses it to stage an Applications alias, set the icon
      # positions, and show the "drag to install" layout.
      - name: Render macOS drag-to-install DMG backdrop
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          brew install librsvg
          bash scripts/render-dmg-background.sh
          python3 scripts/check-macos-dmg-layout.py
      # Family two-step credential supply (turlamai/taskly#122 template).
      # Secrets-driven, so PR jobs and any run without credentials simply
      # skip both steps and fall into the ad-hoc / fail-closed branches below.
      - name: Provision Developer ID certificate
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          signing_dir="$(mktemp -d "$RUNNER_TEMP/fulcrum-signing.XXXXXX")"
          chmod 700 "$signing_dir"
          keychain="$signing_dir/fulcrum.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$signing_dir/identity.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/identity.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -s "$keychain" $(security list-keychains | tr -d '"')
          rm -f "$signing_dir/identity.p12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # `raco rivet release` defaults to production mode, so exporting
          # them alone flips packaging over once --development is gated off.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_CONFIGURED == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      - name: Configure Windows Authenticode identity
        if: matrix.platform == 'windows' && vars.FULCRUM_WINDOWS_SIGNING_MODE == 'authenticode'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) { throw "Missing WINDOWS_CERTIFICATE_PFX (base64-encoded PFX secret)" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "Missing WINDOWS_CERTIFICATE_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { throw "Missing WINDOWS_TIMESTAMP_URL repository variable" }
          $pfx = Join-Path $env:RUNNER_TEMP 'fulcrum-production-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64))
          "RIVET_WINDOWS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "RIVET_WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" >> $env:GITHUB_ENV
      - name: Configure Linux Ed25519 artifact signing
        if: matrix.platform == 'linux'
        shell: bash
        env:
          LINUX_SIGN_PRIVATE_KEY_PEM: ${{ secrets.LINUX_SIGN_PRIVATE_KEY }}
          LINUX_SIGN_KEY_ID: ${{ secrets.LINUX_SIGN_KEY_ID }}
        run: |
          set -euo pipefail
          [[ -n "$LINUX_SIGN_PRIVATE_KEY_PEM" && -n "$LINUX_SIGN_KEY_ID" ]] || {
            echo "::error::Linux production signing secrets are missing"; exit 1;
          }
          key_dir="$(mktemp -d "$RUNNER_TEMP/fulcrum-linux-signing.XXXXXX")"
          chmod 700 "$key_dir"
          printf '%s\n' "$LINUX_SIGN_PRIVATE_KEY_PEM" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -outform DER -out "$key_dir/private.der"
          openssl pkey -in "$key_dir/private.pem" -pubout -outform DER -out "$key_dir/public.der"
          rm -f "$key_dir/private.pem"
          echo "RIVET_LINUX_SIGN_PRIVATE_KEY=$key_dir/private.der" >> "$GITHUB_ENV"
          echo "RIVET_LINUX_SIGN_PUBLIC_KEY=$key_dir/public.der" >> "$GITHUB_ENV"
          echo "RIVET_LINUX_SIGN_KEY_ID=$LINUX_SIGN_KEY_ID" >> "$GITHUB_ENV"
      # The channel manifest is separately Ed25519-signed. Build and verify
      # production-signed artifacts first; only then stage anything for publish.
      - name: Release (production signed)
        if: matrix.platform == 'linux' || (matrix.platform == 'macos' && env.MACOS_SIGNING_CONFIGURED == 'true') || (matrix.platform == 'windows' && vars.FULCRUM_WINDOWS_SIGNING_MODE == 'authenticode')
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          RIVET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          [[ -n "$RIVET_UPDATE_PRIVATE_KEY_PEM" && "$RIVET_UPDATE_KEY_ID" == "fulcrum-2026-10" ]] || {
            echo "::error::Required Ed25519 update key and pinned key ID are missing"; exit 1;
          }
          temp_root="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then temp_root="$(cygpath -u "$RUNNER_TEMP")"; fi
          key_dir="$(mktemp -d "$temp_root/fulcrum-update-signing.XXXXXX")"
          chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY_PEM" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -outform DER -out "$key_dir/private.der"
          rm -f "$key_dir/private.pem"
          export RIVET_UPDATE_PRIVATE_KEY="$key_dir/private.der"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export RIVET_UPDATE_PRIVATE_KEY="$(cygpath -w "$key_dir/private.der")"
          fi
          raco rivet release
          raco rivet verify --production
        shell: bash
      # Independent no-certificate modes: macOS ad-hoc is a dispatch-only
      # smoke path (tag pushes fail closed below); Windows stays var-driven.
      # The update feed remains signed; Linux always uses its Ed25519
      # artifact signatures.
      - name: Release (platform no-certificate mode)
        if: (matrix.platform == 'macos' && env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true') || (matrix.platform == 'windows' && vars.FULCRUM_WINDOWS_SIGNING_MODE != 'authenticode')
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
          RIVET_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          [[ -n "$RIVET_UPDATE_PRIVATE_KEY_PEM" && "$RIVET_UPDATE_KEY_ID" == "fulcrum-2026-10" ]] || {
            echo "::error::Required Ed25519 update key and pinned key ID are missing"; exit 1;
          }
          temp_root="$RUNNER_TEMP"
          if [[ "$RUNNER_OS" == "Windows" ]]; then temp_root="$(cygpath -u "$RUNNER_TEMP")"; fi
          key_dir="$(mktemp -d "$temp_root/fulcrum-update-signing.XXXXXX")"
          chmod 700 "$key_dir"
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY_PEM" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -outform DER -out "$key_dir/private.der"
          rm -f "$key_dir/private.pem"
          export RIVET_UPDATE_PRIVATE_KEY="$key_dir/private.der"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            export RIVET_UPDATE_PRIVATE_KEY="$(cygpath -w "$key_dir/private.der")"
          fi
          raco rivet release --development
          # raco rivet verify (the development form) fails on ad-hoc macOS
          # frameworks and on Windows MSI temp cleanup, so the unsigned
          # channel asserts its real contract directly: the packages and
          # the Ed25519-signed update manifest exist. The manifest job
          # re-verifies the feed signature before anything is published.
          test -f dist/update-stable.json || {
            echo "::error::unsigned release produced no signed update manifest"; exit 1;
          }
        shell: bash
      # Fail closed: a tag push is a release, and releases must be
      # production-signed. Never fall back to ad-hoc on tags.
      - name: Release requires signing credentials
        if: matrix.platform == 'macos' && env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        shell: bash
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      # Wraps the tar.gz payload into a Flatpak bundle from the flatpak/
      # manifest template (family contract: deb+rpm+AppImage+Flatpak+tar.gz).
      # The manifest's module closure covers the two NEEDED entries outside
      # the GNOME Platform runtime (liblz4.so.1, libtinfo.so.6). Like deb/rpm,
      # the flatpak install shape is manual-by-design and stays out of the
      # signed channel manifest.
      - name: Flatpak bundle
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc covers the
          # ubuntu-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/fulcrum-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "fulcrum-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.fulcrum.yml > site.jrtx.fulcrum.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.fulcrum.gen.yml
          flatpak build-bundle flatpak-repo \
            "fulcrum-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.fulcrum stable
          rm -rf flatpak-build flatpak-repo \
            "fulcrum-${VERSION}-linux-${ARCH}.tar.gz" site.jrtx.fulcrum.gen.yml
          test -f "fulcrum-${VERSION}-linux-${ARCH}.flatpak"
      - name: Verify mounted Finder DMG installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-macos-dmg.sh
          dmg=(dist/fulcrum-*.dmg)
          test -f "${dmg[0]}"
          # Only credential-configured (production-signed) runs may claim
          # notarization; ad-hoc is not trusted.
          if [[ "$MACOS_SIGNING_CONFIGURED" == "true" ]]; then
            codesign --verify --verbose=2 "${dmg[0]}"
            xcrun stapler validate "${dmg[0]}"
            spctl --assess --type open --context context:primary-signature "${dmg[0]}"
          fi
      # Versioned + architecture-suffixed names are the release contract: the
      # channel manifest (.github/sign-manifest.rkt) pins exactly these names,
      # and the mac zip doubles as the portable build the update feed serves.
      - name: Name artifacts and checksum
        shell: bash
        run: |
          set -euo pipefail
          # RC tags carry a distribution suffix (vX.Y.Z-rc.N), while native
          # MSI/RPM/macOS package versions remain the numeric VERSION value.
          VERSION="$(tr -d '\r\n' < VERSION)"
          ARCH="${{ matrix.arch }}"
          sha256() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          case "${{ matrix.platform }}" in
            macos)
              mv dist/fulcrum-*.dmg "fulcrum-${VERSION}-macos-${ARCH}.dmg"
              # rivet v0.11 removes the unpacked .app from dist/ once the
              # installers are built; its portable zip (the same payload
              # the update feed serves) already carries the arch suffix —
              # adopt it instead of re-zipping the deleted tree.
              test -f "dist/fulcrum-${VERSION}-macos-${ARCH}.zip"
              test -f "dist/fulcrum-${VERSION}-macos-${ARCH}.zip.sha256"
              mv "dist/fulcrum-${VERSION}-macos-${ARCH}.zip" \
                 "dist/fulcrum-${VERSION}-macos-${ARCH}.zip.sha256" .
              ;;
            windows)
              mv dist/fulcrum-*-windows-*.msi "fulcrum-${VERSION}-windows-x64.msi"
              # rivet's portable zip (same payload the msi installs) with
              # its own sidecar — the update feed's windows artifact shape.
              test -f "dist/fulcrum-${VERSION}-windows-x64.zip"
              test -f "dist/fulcrum-${VERSION}-windows-x64.zip.sha256"
              mv "dist/fulcrum-${VERSION}-windows-x64.zip" \
                 "dist/fulcrum-${VERSION}-windows-x64.zip.sha256" .
              ;;
            linux)
              mv dist/fulcrum-*-linux-*.tar.gz "fulcrum-${VERSION}-linux-${ARCH}.tar.gz"
              # Rivet's production Ed25519 signature must accompany the
              # renamed deterministic tarball, not be lost in dist/.
              signature="dist/fulcrum-${VERSION}-linux-${ARCH}.tar.gz.sig"
              test -s "$signature"
              mv "$signature" "fulcrum-${VERSION}-linux-${ARCH}.tar.gz.sig"
              # rivet's portable zip (with its own sidecar) joins the set.
              test -f "dist/fulcrum-${VERSION}-linux-${ARCH}.zip"
              test -f "dist/fulcrum-${VERSION}-linux-${ARCH}.zip.sha256"
              mv "dist/fulcrum-${VERSION}-linux-${ARCH}.zip" \
                 "dist/fulcrum-${VERSION}-linux-${ARCH}.zip.sha256" .
              # The native installers keep rivet's versioned names (deb arch
              # amd64/arm64, rpm embeds the build number, AppImage
              # x86_64/aarch64); hoist them beside the tar.gz so the
              # checksum loop and the artifact upload glob pick them up.
              for f in dist/fulcrum-*.deb dist/fulcrum-*.rpm dist/fulcrum-*.AppImage; do
                if [ -e "$f" ]; then mv "$f" .; fi
              done
              ;;
          esac
          for f in fulcrum-${VERSION}-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256 "$f" > "$f.sha256"
          done
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-${{ matrix.platform }}-${{ matrix.arch }}
          path: fulcrum-*
          if-no-files-found: error

  channel-manifest:
    name: Sign channel manifest
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: |
          racket -e '(dynamic-require (quote db) #f)' || raco pkg install --auto --no-docs db-lib
          raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          ls -la release/
      - name: Compose and sign the channel manifest
        env:
          # Manifest URLs are tag-pinned (never re-upload under an existing
          # version URL — hashes are pinned by the signed manifest). The
          # signing key + key id still come from the RIVET_UPDATE_* secrets.
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/fulcrum/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_PRIVATE_KEY: ${{ secrets.RIVET_UPDATE_PRIVATE_KEY }}
          RIVET_UPDATE_KEY_ID: ${{ secrets.RIVET_UPDATE_KEY_ID }}
        run: |
          # One channel manifest pins every platform artifact (see
          # .github/sign-manifest.rkt). The secret carries the PEM; the
          # signer wants DER paths, and the signed output is verified
          # against the public key before upload.
          printf '%s\n' "$RIVET_UPDATE_PRIVATE_KEY" > update-private.pem
          openssl pkey -in update-private.pem -outform DER -out update-private.der
          openssl pkey -in update-private.pem -pubout -outform DER -out update-public.der
          racket .github/sign-manifest.rkt
      - uses: actions/upload-artifact@v4
        with:
          name: channel-manifest
          path: |
            dist/update-manifest.json
            dist/manifest.json
          if-no-files-found: error

  github-release:
    name: Draft GitHub release
    needs: channel-manifest
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release
          mv artifacts/fulcrum-*/fulcrum-* release/
          cp artifacts/channel-manifest/update-manifest.json release/
          # byte-identical alias for pre-0.8.0 clients polling manifest.json
          cp artifacts/channel-manifest/manifest.json release/
          # Verify all release payloads before staging public downloads.
          (cd release && cat *.sha256 | sed 's/ \*/  /' | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          mkdir -p public
          while read -r _ name; do
            test -s "release/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "release/$name" "public/$name"
          done < release/SHA256SUMS
          cp release/update-manifest.json release/manifest.json public/
          # Fail closed on missing/extra installer formats or RPM revisions.
          # Hash the exact public inventory, including BOTH signed feed names.
          tag_version="${GITHUB_REF_NAME#v}"
          version="${tag_version%%-rc.*}"
          python3 scripts/check_release_public_assets.py "$version" public
          (cd public && sha256sum -c SHA256SUMS)
          ls -la public/
      # Family standard (movebit-origin): every public release asset carries
      # verifiable build provenance. public/ is the fail-closed inventory the
      # gate just verified, so the glob set is exact; sidecars never land here.
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            public/fulcrum-*
            public/SHA256SUMS
            public/update-manifest.json
            public/manifest.json
      - uses: softprops/action-gh-release@v2
        id: create-release
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          make_latest: ${{ contains(github.ref_name, '-rc.') && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            public/fulcrum-*
            public/SHA256SUMS
            public/update-manifest.json
            public/manifest.json
      - name: Confirm exact draft identity before pruning stale assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create-release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Release creator did not return a numeric REST id"
            exit 1
          }
          prerelease=false
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then prerelease=true; fi
          release_json="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          # For a draft whose tag_name references an existing ref (the gate
          # mints the tag before dispatching this workflow), GitHub detaches
          # the name server-side and reports an untagged-<hash> placeholder
          # until publication (#146). Draft identity is anchored on the
          # numeric REST id; the tag name is accepted in both its requested
          # and detached shapes. Everything else stays strict, and the
          # publication check keeps demanding the exact tag name.
          printf '%s\n' "$release_json" | jq -e --arg tag "$GITHUB_REF_NAME" \
            --argjson id "$RELEASE_ID" --arg sha "$GITHUB_SHA" \
            --argjson prerelease "$prerelease" \
            '((.tag_name == $tag) or (.tag_name | startswith("untagged-"))) and (.draft == true) and (.prerelease == $prerelease) and (.id == $id) and (.target_commitish == $sha)' >/dev/null || {
            echo "::error::Created GitHub draft identity does not match the requested release; refusing further release actions"
            exit 1
          }
      - name: Prune stale or build-only draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create-release.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          # Reruns prune sidecars and aliases; the draft's exact identity
          # was already verified against the tag, SHA, and numeric REST id.
          gh api "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' |
            while IFS=$'\t' read -r id name; do
              if [[ ! -f "public/$name" ]]; then
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" >/dev/null
              fi
            done
      # Keep the independently verified manifest from the exact draft job;
      # the promotion job checks it against GitHub-computed asset digests.
      - name: Retain canonical checksums for draft promotion
        uses: actions/upload-artifact@v4
        with:
          name: fulcrum-public-checksums
          path: public/SHA256SUMS
          if-no-files-found: error
          overwrite: true

  publish:
    name: Verify assets and publish release
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fulcrum-public-checksums
          path: release-verify
      - name: Resolve draft release REST id
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.github-release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Preserve the numeric REST id emitted by the exact creation step.
          # Searching releases by tag cannot locate GitHub's untagged-* draft
          # anomalies and can accidentally select an unrelated old draft.
          release_id="${RELEASE_ID}"
          [[ "$release_id" =~ ^[0-9]+$ ]] || {
            echo "::error::Creation job did not provide a numeric draft release id for $tag"
            exit 1
          }
          release_json="$(gh api "repos/$GH_REPO/releases/$release_id")"
          # GitHub may temporarily detach an existing version tag from a
          # draft and report an untagged-<hash> placeholder (#146).
          # Anchor the resolver to the exact numeric REST id, commit SHA,
          # draft state and channel, as the other draft gates already do.
          prerelease=false
          if [[ "$tag" == *-rc.* ]]; then prerelease=true; fi
          printf '%s\n' "$release_json" | jq -e --arg tag "$tag" \
            --argjson id "$release_id" --arg sha "$GITHUB_SHA" \
            --argjson prerelease "$prerelease" \
            '((.tag_name == $tag) or (.tag_name | startswith("untagged-"))) and (.draft == true) and (.prerelease == $prerelease) and (.id == $id) and (.target_commitish == $sha)' >/dev/null || {
            echo "::error::Release id does not identify the requested version-tag draft"
            exit 1
          }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Disclose platform-specific trust before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
          WINDOWS_SIGNING_MODE: ${{ vars.FULCRUM_WINDOWS_SIGNING_MODE }}
        if: ${{ !contains(github.ref_name, '-rc.') }}
        shell: bash
        run: |
          set -euo pipefail
          windows_mode="${WINDOWS_SIGNING_MODE:-unsigned}"
          if [[ "$MACOS_SIGNING_CONFIGURED" == "true" && "$windows_mode" == "authenticode" ]]; then exit 0; fi
          macos_trust="macOS ad-hoc signed, NOT notarized (Gatekeeper may warn)"
          windows_trust="Windows MSI/ZIP unsigned (SmartScreen may warn)"
          if [[ "$MACOS_SIGNING_CONFIGURED" == "true" ]]; then macos_trust="macOS Developer ID signed and notarization verified by release gate"; fi
          if [[ "$windows_mode" == "authenticode" ]]; then windows_trust="Windows Authenticode verified by release gate"; fi
          body="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.body')"
          banner="> ⚠️ **Release trust status:** $macos_trust; $windows_trust. The update manifest remains Ed25519-signed, and Linux artifacts retain detached signatures."
          [[ "$body" == "$banner"* ]] || \
            gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
              -f body="$(printf '%s\n\n%s' "$banner" "$body")" >/dev/null
      - name: Verify installers and signed feed exist before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          FULCRUM_STABLE_RELEASE_APPROVED: ${{ vars.FULCRUM_STABLE_RELEASE_APPROVED }}
        shell: bash
        run: |
          set -euo pipefail
          # Manual tags must not bypass the authorization applied before
          # automatic version-bump tagging. RCs have their own prerelease
          # safety policy; never promote a stable tag without approval. The
          # Platform signing is independent of stable release authorization.
          if [[ "$GITHUB_REF_NAME" != *-rc.* \
                && "$FULCRUM_STABLE_RELEASE_APPROVED" != "true" ]]; then
            echo "::error::Stable release promotion is not approved; draft remains unpublished"
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          test "${tag#v}" != "$tag" || { echo "::error::Not a version tag"; exit 1; }
          tag_version="${tag#v}"
          version="${tag_version%%-rc.*}"
          prerelease=false
          make_latest=true
          if [[ "$tag_version" == *-rc.* ]]; then
            prerelease=true
            make_latest=false
          fi
          # gh release view by tag may fail for drafts. The numeric REST release
          # id was resolved above; verify it is still the expected draft before
          # checking assets. Never accept a different tag or published release.
          # The tag name may still be GitHub's untagged-<hash> placeholder for
          # a draft referencing an existing ref (#146); the publication PATCH
          # below rebinds it, and the post-publish check demands it exactly.
          release_json="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          printf '%s\n' "$release_json" | jq -e --arg tag "$tag" \
            --argjson id "$RELEASE_ID" --arg sha "$GITHUB_SHA" \
            --argjson prerelease "$prerelease" \
            '((.tag_name == $tag) or (.tag_name | startswith("untagged-"))) and (.draft == true) and (.prerelease == $prerelease) and (.id == $id) and (.target_commitish == $sha)' >/dev/null || {
            echo "::error::Draft release metadata mismatch for $tag"; exit 1;
          }
          assets="$(printf '%s\n' "$release_json" | jq -r '.assets[].name')"
          required=(
            "fulcrum-${version}-macos-arm64.dmg" \
            "fulcrum-${version}-macos-x64.dmg" \
            "fulcrum-${version}-windows-x64.msi" \
            "fulcrum-${version}-macos-arm64.zip" \
            "fulcrum-${version}-macos-x64.zip" \
            "fulcrum-${version}-windows-x64.zip" \
            "fulcrum-${version}-linux-arm64.zip" \
            "fulcrum-${version}-linux-x64.zip" \
            "fulcrum-${version}-linux-amd64.deb" \
            "fulcrum-${version}-linux-arm64.deb" \
            "fulcrum-${version}-linux-x86_64.AppImage" \
            "fulcrum-${version}-linux-aarch64.AppImage" \
            "fulcrum-${version}-linux-x64.flatpak" \
            "fulcrum-${version}-linux-arm64.flatpak" \
            "fulcrum-${version}-linux-x64.tar.gz" \
            "fulcrum-${version}-linux-arm64.tar.gz" \
            "fulcrum-${version}-linux-x64.tar.gz.sig" \
            "fulcrum-${version}-linux-arm64.tar.gz.sig" \
            "update-manifest.json" "manifest.json" "SHA256SUMS")
          # Complete stable releases require all native Linux installers.
          # RPM uses a distinct package build revision.
          for name in "${required[@]}"; do
            printf '%s\n' "$assets" | grep -Fx "$name" || {
              echo "::error::Missing release asset $name"; exit 1;
            }
          done
          for rpm_arch in x86_64 aarch64; do
            printf '%s\n' "$assets" | grep -Eq "^fulcrum-${version}-[0-9]+-linux-${rpm_arch}\.rpm$" || {
              echo "::error::Missing Linux RPM for $rpm_arch"; exit 1;
            }
          done
          if printf '%s\n' "$assets" | grep -Eq '(\.sha256$|^fulcrum-(macos|windows|linux)-)'; then
            echo "::error::Redundant checksum sidecar or versionless alias leaked to release"
            exit 1
          fi
          # Compare every uploaded GitHub asset's server-side SHA-256 with
          # the SHA256SUMS verified before the draft was created. This also
          # rejects incomplete uploads and any extra files on the draft.
          printf '%s\n' "$release_json" | \
            python3 scripts/check_release_uploaded_assets.py "$version" release-verify/SHA256SUMS
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$tag" \
            -F draft=false -F prerelease="$prerelease" \
            -f make_latest="$make_latest" >/dev/null
          # Verify publication through the same REST id; do not rely on tag
          # lookup behavior for the draft-to-published transition.
          published_json="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID")"
          printf '%s\n' "$published_json" | jq -e --arg tag "$tag" \
            --argjson id "$RELEASE_ID" --arg sha "$GITHUB_SHA" \
            --argjson prerelease "$prerelease" \
            '(.tag_name == $tag) and (.draft == false) and (.prerelease == $prerelease) and (.id == $id) and (.target_commitish == $sha)' >/dev/null || {
            echo "::error::Published release metadata mismatch for $tag"; exit 1;
          }
