name: Windows MSI Upgrade Lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/acceptance/windows-msi-upgrade-smoke.ps1'
      - 'scripts/acceptance/windows-signed-feed-smoke.rkt'
      - '.github/workflows/windows-msi-upgrade-smoke.yml'

permissions:
  contents: read

env:
  # Same immutable upstream revision as CI, Release and Product Acceptance.
  RIVET_PIN: 4a248bbb7d9c051c6d35d7bd4d7931f0eee9ee27

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installed-upgrade:
    name: Installed MSI 0.13.1 to 0.13.2
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Racket (CS)
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
          architecture: x64
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          # Racket 9.3 can fail enumerating the Windows ROOT store (X509*->C).
          # Use the same trusted, hostname-verified TLS workaround as CI.
          $bundle = Join-Path $env:RUNNER_TEMP 'fulcrum-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "FULCRUM_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet updater dependencies with verified TLS
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - name: Verify official signed update discovery and MSI payload
        shell: bash
        run: racket scripts/acceptance/windows-signed-feed-smoke.rkt
      - name: Verify official MSI checksum and real installed major upgrade
        shell: pwsh
        run: |
          ./scripts/acceptance/windows-msi-upgrade-smoke.ps1
