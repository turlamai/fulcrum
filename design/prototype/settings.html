<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fulcrum — Settings</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="settings-window" id="app">
    <header class="settings-titlebar">
      <a class="back-link" id="back-to-search" href="panel.html" aria-label="Return to launcher">←</a>
      <strong>Settings</strong>
      <span class="title-note">Fulcrum</span>
      <button class="quiet" id="theme-toggle" type="button" aria-label="Toggle light or dark theme">Theme</button>
    </header>
    <div class="settings-body">
      <aside class="settings-sidebar">
        <label class="search-label" for="settings-search">Search settings</label>
        <input id="settings-search" type="search" autocomplete="off">
        <nav id="settings-nav" aria-label="Settings sections"></nav>
      </aside>
      <section class="settings-content" id="content" tabindex="-1" aria-label="Current settings"></section>
    </div>
    <footer class="settings-footer">
      <span id="save-state"></span>
      <span id="feedback" role="status"></span>
    </footer>
    <dialog id="editor" aria-labelledby="dialog-title"></dialog>
  </main>
  <script src="search-settings.js"></script>
  <script src="updates.js"></script>
  <script src="settings.js"></script>
</body>
</html>
