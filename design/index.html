<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fulcrum — 原型目录</title>
<link rel="stylesheet" href="prototype/shared.css">
<style>
  /* overview page: every prototype screen by its page title, plus the contract */
  :root { --shell-w: 680px; }
  .pages { width: 680px; max-width: 100%; display: flex; flex-direction: column; }
  .pages a {
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; flex: none;
    padding: 12px 16px; border-bottom: 1px solid var(--hairline);
    color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.4;
  }
  .pages a:first-child { border-top: 1px solid var(--hairline); }
  .pages a:hover { background: var(--hover); }
  .pages a span { font-size: 12px; color: var(--faint); }
  .note { width: 680px; max-width: 100%; font-size: 12px; line-height: 1.65; color: var(--mute); }
  .note a { color: var(--accent-text); }
</style>
</head>
<body>
  <header class="cap">
    <div class="t">Fulcrum — 原型</div>
    <div class="n">7 个页面 · 亮暗成对 · 原型 v0.1</div>
    <div class="sp"></div>
    <button class="iconbtn" type="button" data-theme-toggle id="themeBtn" aria-label="切换深色主题" title="切换深色主题"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path></svg></button>
  </header>

  <nav class="pages" aria-label="原型页面">
    <a href="prototype/panel.html">Fulcrum — Panel 原型（英雄屏）<span>主入口</span></a>
    <a href="prototype/states.html">Fulcrum — 关键状态三联</a>
    <a href="prototype/actions.html">Fulcrum — ⌘K 次级操作</a>
    <a href="prototype/ai.html">Fulcrum — 计算与 AI 流式</a>
    <a href="prototype/settings.html">Fulcrum — Settings</a>
    <a href="prototype/workflow.html">Fulcrum — Workflow Pro 编排概念（探索稿）</a>
    <a href="prototype/audit.html">Fulcrum — 原型自检（状态矩阵）</a>
  </nav>

  <p class="note">各页顶部导航的「目录」链接回到这一页。视觉与交互契约见 <a href="DESIGN.md">DESIGN.md</a>。原型只在浏览器内演示交互，不连接后端、模型或系统服务。</p>

  <script>
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });
  </script>
  <script src="prototype/prototype-runtime.js"></script>
</body>
</html>
